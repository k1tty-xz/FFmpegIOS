name: Build FFmpeg for iOS (arm64)

# Cross-compiles a static FFmpeg + ffprobe for jailbroken iOS arm64 on a macOS
# (Apple Silicon) runner, ldid-signs the binaries, and packages an installable
# .deb. The signed binaries, headers/libs, and the .deb are uploaded as an
# artifact. Trigger manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "FFmpeg release version (ffmpeg.org/releases)"
        default: "8.1.2"
      ios_min:
        description: "Minimum iOS deployment target"
        default: "14.0"
      deb_arch:
        description: "dpkg arch — match the device (dpkg --print-architecture)"
        default: "iphoneos-arm"

jobs:
  build:
    runs-on: macos-14            # Apple Silicon; ships Xcode + the iPhoneOS SDK
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          clang --version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Install build tools
        run: |
          # nasm/yasm        : asm assemblers probed by some configure scripts
          # autoconf/automake/libtool : regenerate ./configure for git sources
          # cmake/meson/ninja : x265 (cmake) and dav1d (meson)
          # ldid             : entitlement-sign so binaries run on the device
          # dpkg             : build the installable .deb
          brew install nasm yasm automake autoconf libtool cmake meson ninja \
                       ldid coreutils pkg-config dpkg

      - name: Build FFmpeg + dependencies
        run: bash scripts/build-ffmpeg-ios.sh "${{ inputs.ffmpeg_version }}" "${{ inputs.ios_min }}"

      - name: Package .deb
        run: bash scripts/package-deb.sh "${{ inputs.ffmpeg_version }}" "${{ inputs.deb_arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ inputs.ffmpeg_version }}-ios-arm64
          path: artifacts/**
          if-no-files-found: error
